<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#04060d">
<title>Hunter System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a phone-width app shell. Fixed status strip on top, one scrolling page in the middle,
     five-tab bar at the bottom. Single dark theme by choice: glowing HUD glass on a void. */
  color-scheme:dark;
  --void:#04060d;
  --panel:rgba(14,26,52,.72);
  --line:rgba(84,160,255,.22);
  --glow:#54c8ff;
  --deep:#2b6dff;
  --text:#e2edff;
  --muted:#7f95b9;
  --gold:#ffc95c;
  --bad:#ff6078;
  --display:"Chakra Petch","Trebuchet MS",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(700px 420px at 50% -8%, rgba(54,120,255,.22), transparent 70%),
    radial-gradient(500px 300px at 100% 100%, rgba(84,200,255,.07), transparent 70%),
    var(--void);
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  display:flex;justify-content:center;overflow:hidden;
}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;position:relative}

/* ---- status strip ---- */
.top{display:flex;gap:14px;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(10,19,38,.9),rgba(10,19,38,.55))}
.emblem{
  flex:none;width:58px;height:58px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:32px;
  color:var(--glow);text-shadow:0 0 16px var(--glow);background:rgba(84,200,255,.07);
  border:1.5px solid var(--glow);box-shadow:0 0 18px rgba(84,200,255,.25),inset 0 0 14px rgba(84,200,255,.12);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tname{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlv{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.tlv b{display:inline-block;font-size:22px;color:var(--glow);letter-spacing:0;text-shadow:0 0 12px rgba(84,200,255,.6)}
.tlv b.bump{animation:bump .5s var(--ease)}
.sub{font-size:12.5px;color:var(--muted)}
.xpbar{height:8px;border-radius:8px;background:rgba(84,160,255,.12);overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,var(--deep),var(--glow));
  box-shadow:0 0 12px var(--glow);transition:width .7s var(--ease)}
.xpbar.pulse{animation:barpulse .7s ease}
.xpbar.gold i{background:linear-gradient(90deg,#c98a1b,var(--gold));box-shadow:0 0 12px var(--gold)}

/* ---- pages ---- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 18px 28px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.page{display:flex;flex-direction:column;gap:16px}
.page[hidden]{display:none}
.page.in-r{animation:inR .34s var(--ease)}
.page.in-l{animation:inL .34s var(--ease)}
.page.in-r>*,.page.in-l>*{animation:rise .42s var(--ease) both}
.page.in-r>*:nth-child(2),.page.in-l>*:nth-child(2){animation-delay:.05s}
.page.in-r>*:nth-child(3),.page.in-l>*:nth-child(3){animation-delay:.1s}
.page.in-r>*:nth-child(n+4),.page.in-l>*:nth-child(n+4){animation-delay:.15s}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.phead h1{font-size:24px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.eyebrow{font-family:var(--display);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--glow)}
.meta{font-size:13px;color:var(--muted);text-align:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04)}
.card h2{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
.note{font-size:14px;color:var(--muted);margin:0}
.note b{color:var(--text);font-weight:600}
.ok{color:var(--glow)}.miss{color:var(--bad)}

/* quests */
.segs{display:flex;gap:5px}
.segs i{flex:1;height:4px;border-radius:4px;background:rgba(84,160,255,.14);transition:background .4s,box-shadow .4s}
.segs i.on{background:var(--glow);box-shadow:0 0 8px var(--glow)}
.quests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.quest{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;transition:border-color .3s,background .3s}
.qmain{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;transition:transform .15s}
.qmain:active{transform:scale(.98)}
.timer{position:relative;z-index:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 16px 14px 56px}
.stepb{width:34px;height:34px;border-radius:50%;border:1px solid var(--glow);color:var(--glow);font-size:20px;line-height:1;display:grid;place-items:center;
  background:rgba(84,200,255,.08);transition:transform .15s}
.stepb:active{transform:scale(.88)}
.stepb[disabled]{opacity:.3;cursor:not-allowed}
.tval{min-width:66px;text-align:center;color:var(--muted);font-size:14px}
.tval b{font-family:var(--display);font-size:20px;color:var(--text)}
.thint{font-size:12.5px;color:var(--muted);flex:1 1 150px}
.sgrade{display:flex;gap:16px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid rgba(84,160,255,.12)}
.sgrade .gl{flex:none;width:64px;height:64px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--glow);
  font-family:var(--display);font-weight:700;font-size:34px;color:var(--glow);text-shadow:0 0 14px var(--glow);box-shadow:0 0 18px rgba(84,200,255,.25);animation:pop .5s var(--ease)}
.hrs{display:flex;flex-direction:column;gap:8px}
.hrs div{display:flex;gap:14px;align-items:baseline}
.hrs b{font-family:var(--display);font-size:18px;color:var(--gold);min-width:44px}
.hrs span{color:var(--muted);font-size:14px}
.qblock{padding:12px 0;border-top:1px solid rgba(84,160,255,.12)}
.qblock:first-of-type{border-top:0;padding-top:0}
.qtop{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.qnums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qnums .field{min-width:0;font-size:11.5px}
.box{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--glow);display:grid;place-items:center;transition:background .25s,box-shadow .25s}
.box svg{width:16px;height:16px;stroke:var(--void);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.quest.done{border-color:rgba(84,200,255,.5);background:rgba(84,200,255,.1)}
.quest.done .box{background:var(--glow);box-shadow:0 0 14px var(--glow)}
.quest.done .box svg{stroke-dashoffset:0}
.quest.done .qname{color:var(--muted)}
.quest.just .box{animation:pop .45s var(--ease)}
.quest.just .box svg{animation:draw .35s .1s ease both}
.quest.just::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(84,200,255,.35) 50%,transparent 70%);
  transform:translateX(-100%);animation:sweep .6s ease forwards;pointer-events:none}
.qname{font-weight:500;font-size:16.5px;overflow-wrap:anywhere;transition:color .3s}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:10px;height:3px;border-radius:3px;background:rgba(84,160,255,.16)}
.dots i.on{background:var(--glow)}
.xp{font-family:var(--display);color:var(--gold);font-size:14px;white-space:nowrap}
.bonus{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);
  border:1px dashed var(--line);border-radius:14px;padding:12px 16px;transition:color .3s,border-color .3s}
.bonus.on{color:var(--gold);border-color:rgba(255,201,92,.5)}

/* forms */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);flex:1;min-width:104px}
input[type=time],input[type=text],input[type=number],input[type=password],textarea,select{font:inherit;
  background:rgba(4,8,18,.7);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);width:100%;min-width:0}
input:focus{border-color:var(--glow);outline:none;box-shadow:0 0 0 3px rgba(84,200,255,.15)}
.btn{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:11px 16px;border-radius:10px;
  background:linear-gradient(180deg,rgba(84,200,255,.22),rgba(84,200,255,.1));border:1px solid var(--glow);color:var(--glow);
  transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%}
.btn.ghost{border-color:var(--line);color:var(--muted);background:transparent}
.btn.gold{border-color:var(--gold);color:var(--gold);background:linear-gradient(180deg,rgba(255,201,92,.2),rgba(255,201,92,.07))}
.btn.bad{border-color:rgba(255,96,120,.6);color:var(--bad);background:transparent}

/* sleep */
.target{display:flex;justify-content:space-around;align-items:center;gap:10px;text-align:center}
.target div span{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--display)}
.target div b{font-family:var(--display);font-size:34px;font-weight:600;color:var(--text)}
.target .arrow{color:var(--glow);font-size:22px}
.nights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.nights li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;padding:9px 0;border-top:1px solid rgba(84,160,255,.1);font-size:14px}
.nights li:first-child{border-top:0}
.nights .d{color:var(--muted)}

/* gate */
.gate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.gate.done{border-color:rgba(255,201,92,.55);box-shadow:0 0 40px rgba(255,201,92,.12)}
.gring{position:relative;width:170px;height:170px}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring circle{fill:none;stroke-width:8}
.gring .trk{stroke:rgba(84,160,255,.13)}
.gring .val{stroke:var(--glow);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease);filter:drop-shadow(0 0 6px var(--glow))}
.gate.done .gring .val,.gate.live .gring .val{stroke:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
.gring .mid{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.gring .mid b{font-family:var(--display);font-size:36px;font-weight:700;line-height:1}
.gring .mid span{font-size:13px;color:var(--muted)}
.gate h3{font-size:20px;font-weight:600;letter-spacing:.02em}
.pill{font-family:var(--display);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.pill.live{border-color:var(--gold);color:var(--gold);animation:breathe 2s ease-in-out infinite}
.pill.won{border-color:var(--gold);color:var(--void);background:var(--gold)}
.gate .row{width:100%}

/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-family:var(--display);font-size:28px;font-weight:600;color:var(--text)}
.tile span{font-size:13px;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.ladder div{padding:8px 0;border-radius:10px;border:1px solid transparent;color:var(--muted)}
.ladder b{display:block;font-family:var(--display);font-size:22px}
.ladder span{font-size:11px}
.ladder .got{color:var(--text)}
.ladder .cur{border-color:var(--glow);color:var(--glow);background:rgba(84,200,255,.1);box-shadow:0 0 16px rgba(84,200,255,.2)}
.log{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:140px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;color:var(--muted);min-width:0}
.day .bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--glow),var(--deep));min-height:3px;opacity:.7;transform-origin:bottom}
.page.in-r .day .bar,.page.in-l .day .bar{animation:grow .6s var(--ease) both}
.day.zero .bar{background:rgba(84,160,255,.16)}
.day.today .bar{opacity:1;box-shadow:0 0 10px var(--glow)}
.day.today span:last-child{color:var(--glow)}
.attr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:14px}
.attr+.attr{margin-top:12px}
.attr .xpbar{grid-column:1/-1;height:5px}
.attr span:nth-child(2){color:var(--muted)}

/* setup */
.qedit{display:grid;grid-template-columns:1fr 104px auto;gap:8px;align-items:center}
.qedit+.qedit{margin-top:8px}
.stackg{display:flex;flex-direction:column;gap:10px}

/* attributes, gold, armory */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px;white-space:nowrap}
.chip b{color:var(--text);font-size:13px;letter-spacing:0}
.chip.g{border-color:rgba(255,201,92,.4)}.chip.g b{color:var(--gold)}
.qt{display:inline-block;margin-left:8px;font-family:var(--display);font-size:10px;letter-spacing:.12em;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);vertical-align:2px}
.qt.str{color:#ff9a7a;border-color:rgba(255,154,122,.4)}.qt.iq{color:#b9a4ff;border-color:rgba(185,164,255,.4)}
.alv{font-family:var(--display);color:var(--glow);margin-left:6px}
.purse{text-align:right;line-height:1.1}
.purse b{display:block;font-family:var(--display);font-size:28px;color:var(--gold);text-shadow:0 0 14px rgba(255,201,92,.45)}
.purse span{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-family:var(--display)}
.stage{position:relative;height:380px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#070a14;
  box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03)}
.stage canvas{width:100%;height:100%;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px rgba(2,4,10,.75)}
.stage .hint{position:absolute;left:12px;bottom:10px;z-index:1;font-size:12px;color:rgba(226,237,255,.7);pointer-events:none;text-shadow:0 1px 4px #000;max-width:55%}
.stage .poseb{position:absolute;right:10px;bottom:10px;z-index:1;background:rgba(6,11,24,.7);backdrop-filter:blur(6px)}
.nostage{text-align:center}
.loadout{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loadout .slot{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(4,8,18,.45);min-width:0;transition:border-color .2s}
.loadout .slot.sel{border-color:var(--glow)}
.boosts{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid rgba(84,160,255,.14);padding-top:12px}
.boosts div b{font-family:var(--display);font-size:22px}
.boosts .s b{color:#ff9a7a}.boosts .i b{color:#b9a4ff}
.boosts span{display:block;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.fchip[aria-pressed=true]{border-color:var(--glow);color:var(--glow);background:rgba(84,200,255,.1)}
.atag.str{color:#ff9a7a}.atag.iq{color:#b9a4ff}
.slot span,.boost span{display:block;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.slot b{font-family:var(--display);font-size:16px;font-weight:600;overflow-wrap:anywhere}
.slot b.empty{color:var(--muted);font-weight:500}
.boost{border-top:1px solid rgba(84,160,255,.14);padding-top:12px}
.boost b{font-family:var(--display);font-size:26px;color:var(--glow);text-shadow:0 0 12px rgba(84,200,255,.5)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid rgba(84,160,255,.1)}
.item:first-child{border-top:0;padding-top:0}
.item.just{animation:pop .5s var(--ease)}
.glyph{width:42px;height:42px;border-radius:11px;border:1.5px solid;display:grid;place-items:center;background:rgba(4,8,18,.6)}
.glyph svg{width:24px;height:24px}
.imain{min-width:0}
.iname{font-weight:600;overflow-wrap:anywhere}
.item.on .iname{color:var(--r)}
.imeta{font-size:13px;color:var(--muted)}
.rar{color:var(--r);font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:8px}
.btn.sm{padding:8px 12px;font-size:12px;min-width:86px}
.qlock{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.fixed{text-align:right;padding-bottom:6px}
.fixed b{display:block;font-family:var(--display);color:var(--gold)}
.fixed span{font-size:11.5px;color:var(--muted)}

/* ---- tab bar ---- */
nav{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:rgba(6,11,24,.92);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));position:relative}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;color:var(--muted);
  font-family:var(--display);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;transition:color .25s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.tab[aria-current=page]{color:var(--glow)}
.tab[aria-current=page] svg{transform:translateY(-2px);filter:drop-shadow(0 0 6px var(--glow))}
.tab .dot{position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.ink{position:absolute;top:-1px;left:6px;height:2px;width:calc((100% - 12px)/6);background:var(--glow);box-shadow:0 0 10px var(--glow);
  transition:transform .35s var(--ease);border-radius:2px}

/* ---- effects ---- */
.fx{position:fixed;z-index:30;pointer-events:none;font-family:var(--display);font-weight:700;font-size:18px;color:var(--gold);
  text-shadow:0 0 12px rgba(255,201,92,.8);animation:floatup 1s var(--ease) forwards;white-space:nowrap}
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:20;

    act(function(){
      var x=challenge();x.progress=Math.round((x.progress+n)*100)/100;
      if(x.progress>=x.target&&!x.done){x.done=true;cleared=true;
        notify({kind:"reward",tag:"Weekend gate cleared",title:state.reward,body:x.title+" complete. +"+x.xp+" XP."})}
      setChallenge(x);
    });
    if(!cleared)floatXp($("gateAdd"),"+"+n+" "+c.unit);
  }
  addBtn.addEventListener("click",add);
  amt.addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  var w=logical().getDay(),left=6-w;
  var when=c.done?"Cleared":open?"Open now":left===1?"Opens tomorrow":"Opens in "+left+" days";
  var tools=[];
  if(!c.done){
    tools.push(h("button",{class:"btn ghost",type:"button",text:"Reroll",style:"flex:1",onclick:reroll}));
    if(sample||pplxKey)tools.push(h("button",{class:"btn ghost",type:"button",style:"flex:1",disabled:aiBusy,text:aiBusy?"Thinking...":"AI challenge",onclick:aiChallenge}));
  }
  fill($("page-gate"),[
    h("div",{class:"phead"},[
      h("div",null,[h("div",{class:"eyebrow",text:"Weekly challenge"}),h("h1",{text:"Weekend gate"})]),
      h("span",{class:"pill "+(c.done?"won":open?"live":""),text:when})]),
    h("div",{class:"card gate"+(c.done?" done":open?" live":"")},[
      h("div",{class:"gring"},[
        svg("svg",{viewBox:"0 0 120 120","aria-hidden":"true"},[svg("circle",{class:"trk",cx:"60",cy:"60",r:"52"}),val]),
        h("div",{class:"mid num"},[h("b",{text:pct+"%"}),h("span",{text:c.progress+" / "+c.target})])]),
      h("h3",{text:c.title}),
      h("p",{class:"note num"},["Reward: ",h("b",{text:state.reward})," · +"+c.xp+" XP"]),
      c.done?h("p",{class:"note",text:"Reward claimed. A new gate opens next Saturday."}):
      h("div",{class:"row"},[h("label",{class:"field",style:"text-align:left"},["Add "+c.unit,amt]),addBtn]),
      (!c.done&&!open)?h("p",{class:"note",text:"Logging unlocks Saturday at 04:00 and closes Monday at 04:00."}):null
    ]),
    tools.length?h("div",{class:"row"},tools):null,
    aiMsg?h("p",{class:"note miss",text:aiMsg}):null

}
function reroll(){
  var cur=challenge(),opts=POOL.filter(function(p){return p.title!==cur.title});
  var p=opts[Math.floor(Math.random()*opts.length)];
  aiMsg="";lastGatePct=0;
  act(function(){setChallenge({title:p.title,target:p.target,unit:p.unit,xp:p.xp,progress:0,done:false})});
  var pg=$("page-gate");replay(pg,"in-r");
}
function aiChallenge(){
  if((!sample&&!pplxKey)||aiBusy)return;
  aiBusy=true;aiMsg="";renderGate();
  var past=Object.keys(state.challenges).sort().slice(-6).map(function(k){return state.challenges[k].title});
  var prompt="Design one weekend challenge for a habit tracker styled like an RPG levelling system. "+
    "The player's daily habits are: "+state.quests.map(function(q){return q.name}).join(", ")+". "+
    "The challenge must be hard but safely doable by a healthy adult across Saturday and Sunday, measurable with one number, and tied to one of those habits. "+
    "Do not repeat these recent ones: "+(past.join("; ")||"none")+". "+
    'Reply with only JSON like {"title":"Read 100 pages over the weekend","target":100,"unit":"pages","xp":150}. '+
    "title under 60 characters, target a positive number, unit one or two words, xp between 100 and 250.";
  askAi(prompt).then(function(r){
    var t=r&&String(r.title||"").slice(0,80),n=Number(r&&r.target),u=r&&String(r.unit||"").slice(0,24);
    if(!t||!(n>0)||!u)throw{code:"invalid_json"};
    var xp=Math.max(100,Math.min(250,Math.round(Number(r.xp)||150)));
    aiBusy=false;lastGatePct=0;
    act(function(){setChallenge({title:t,target:n,unit:u,xp:xp,progress:0,done:false})});
    replay($("page-gate"),"in-r");
  }).catch(function(e){
    aiBusy=false;
    var code=e&&e.code;
    if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed"){sample=null}
    else if(code==="pplx_auth")aiMsg="Perplexity rejected the API key. Check it on the Setup page.";
    else if(code==="pplx_net")aiMsg="Could not reach Perplexity from this app. Use Reroll or set your own challenge in Setup.";
    else if(code==="rate_limited")aiMsg="AI is rate limited right now. Try again later or use Reroll.";
    else if(code!=="cancelled")aiMsg="The AI did not return a usable challenge. Try again or use Reroll.";
    renderGate();
  });
}

/* ---- stats page ---- */
function renderStats(){
  var lt=logical(),days=[],max=100,i,xp=totalXp(),L=levelOf(xp),cur=rankOf(L.level),nr=nextRank(L.level);
  for(i=13;i>=0;i--){var d=addDays(lt,-i),x=dayXp(state.days[ymd(d)]);days.push({d:d,xp:x,today:i===0});if(x>max)max=x}
  var gates=0,k;for(k in state.challenges)if(state.challenges[k].done)gates++;

  var top=Math.max.apply(null,[1].concat(counts.map(function(c){return c.n})));
  var ladder=RANKS.slice().reverse().map(function(r){
    return h("div",{class:r[1]===cur?"cur":L.level>=r[0]?"got":""},[h("b",{text:r[1]}),h("span",{class:"num",text:"Lv "+r[0]})]);

    h("div",{class:"tiles num"},[
      h("div",{class:"tile"},[h("b",{text:String(xp)}),h("span",{text:"Total XP"})]),

    h("div",{class:"card"},[h("h2",{text:"Attributes"}),
      (function(){var x=attrXp("str"),A=attrLevel(x);return h("div",{class:"attr num"},[h("span",null,["Strength ",h("b",{class:"alv",text:"Lv "+A.level})]),h("span",{text:A.into+" / "+A.need+" XP"}),
        h("div",{class:"xpbar"},[h("i",{style:"width:"+Math.round(A.into/A.need*100)+"%"})])])})(),
      (function(){var x=attrXp("iq"),A=attrLevel(x);return h("div",{class:"attr num"},[h("span",null,["IQ ",h("b",{class:"alv",text:"Lv "+A.level})]),h("span",{text:A.into+" / "+A.need+" XP"}),
        h("div",{class:"xpbar"},[h("i",{style:"width:"+Math.round(A.into/A.need*100)+"%"})])])})(),
      h("p",{class:"note",style:"margin-top:12px",text:"Strength grows from physical habits and IQ from reading, research and other mind work. Set each habit's type in Setup."})]),
    h("div",{class:"card"},[h("h2",{text:"Rank ladder"}),h("div",{class:"ladder"},ladder)]),
    h("div",{class:"card"},[h("h2",{text:"XP per day, last 14 days"}),
      h("div",{class:"log num"},days.map(function(o,idx){
        var bar=h("div",{class:"bar",style:"height:"+Math.round(o.xp/max*100)+"%;animation-delay:"+(idx*25)+"ms"});
        return h("div",{class:"day"+(o.today?" today":"")+(o.xp?"":" zero"),title:o.d.toDateString()+": "+o.xp+" XP"},[
          h("span",{text:o.xp?String(o.xp):""}),bar,h("span",{text:String(o.d.getDate())})]);
      }))]),
    h("div",{class:"card"},[h("h2",{text:"Quests cleared, all time"})].concat(
      counts.length?counts.map(function(c){
        return h("div",{class:"attr num"},[h("span",{text:c.q.name}),h("span",{text:c.n+(c.n===1?" day":" days")}),
          h("div",{class:"xpbar"},[h("i",{style:"width:"+Math.round(c.n/top*100)+"%"})])]);
      }):[h("p",{class:"note",text:"No quests set up."})]))
  ]);

/* ---- setup page ---- */
var resetArmed=false;
function quiet(fn){fn();save();updateTop(false)}
function renderSetup(){
  var T=state.sleep,c=challenge();
  var name=h("input",{type:"text",id:"setName",maxlength:"30",value:state.name,onchange:function(){var v=name.value.trim();if(v)quiet(function(){state.name=v})}});
  var reward=h("input",{type:"text",id:"setReward",maxlength:"40",value:state.reward,onchange:function(){var v=reward.value.trim();if(v)quiet(function(){state.reward=v})}});
  var best=h("input",{type:"time",id:"setBest",value:T.best,onchange:function(){if(best.value)quiet(function(){T.best=best.value})}});
  var goal=h("input",{type:"number",id:"setGoal",min:"4",max:"10",step:"0.5",value:T.goal,onchange:function(){var n=Number(goal.value);if(n>=4&&n<=10)quiet(function(){T.goal=n})}});
  function numField(q,key,label,lo,hi){
    var x=h("input",{type:"number",id:"q-"+key+"-"+q.id,min:String(lo),max:String(hi),value:q[key],onchange:function(){
      var v=Math.round(Number(x.value));if(v>=lo&&v<=hi)quiet(function(){q[key]=v})}});
    return h("label",{class:"field"},[label,x]);
  }
  function typeSel(id,val,onpick){
    var sel=h("select",{id:id,"aria-label":"Attribute"},[h("option",{value:"str",text:"Strength"}),h("option",{value:"iq",text:"IQ"}),h("option",{value:"",text:"Neither"})]);
    sel.value=val||"";if(onpick)sel.addEventListener("change",function(){onpick(sel.value)});return sel;
  }
  var qrows=state.quests.map(function(q,i){
    var n=h("input",{type:"text",id:"q-name-"+q.id,maxlength:"40",value:q.name,"aria-label":"Quest name",onchange:function(){var v=n.value.trim();if(v)quiet(function(){q.name=v})}});
    var ts=typeSel("q-type-"+q.id,q.type,function(v){quiet(function(){q.type=v;syncTypes()})});
    return h("div",{class:"qblock"},[
      h("div",{class:"qtop"},[n,h("button",{class:"btn bad",type:"button",text:"✕","aria-label":"Remove "+q.name,onclick:function(){quiet(function(){state.quests.splice(i,1)});renderSetup()}})]),
      q.locked?h("div",{class:"qlock"},[h("label",{class:"field"},["Builds",ts]),h("div",{class:"fixed num"},[h("b",{text:CUSTOM_XP+" XP"}),h("span",{text:"fixed"})])])
      :h("div",null,[h("div",{class:"qnums"},[numField(q,"xp","Base XP",1,500),numField(q,"min","Min minutes",0,600),numField(q,"step","Extra every",1,240),numField(q,"bonus","XP per extra",0,500)]),
        h("label",{class:"field",style:"margin-top:8px"},["Builds",ts])])]);
  });
  var nq=h("input",{type:"text",id:"newQuestName",maxlength:"40",placeholder:"New habit, e.g. Cold shower","aria-label":"New habit name"});
  var nx=typeSel("newQuestType","str");
  function addQuest(){var v=nq.value.trim();if(!v)return;
    quiet(function(){state.quests.push({id:"q"+Date.now().toString(36),name:v,xp:CUSTOM_XP,min:0,step:10,bonus:0,type:nx.value,locked:true});syncTypes()});renderSetup()}
  var keyIn=h("input",{type:"password",id:"pplxKey",autocomplete:"off",placeholder:"pplx-...",value:pplxKey,onchange:function(){
    pplxKey=keyIn.value.trim();try{if(pplxKey)localStorage.setItem(PPLX_KEY,pplxKey);else localStorage.removeItem(PPLX_KEY)}catch(e){}
    aiMsg="";renderSetup();toast(pplxKey?"Key saved on this device":"Key removed")}});
  var backup=h("textarea",{id:"backupText",rows:"3",placeholder:"Paste a backup here to restore it"});
  var ct=h("input",{type:"text",id:"chTitle",maxlength:"80",value:c.title});
  var cn=h("input",{type:"number",id:"chTarget",min:"1",step:"any",value:c.target});
  var cu=h("input",{type:"text",id:"chUnit",maxlength:"24",value:c.unit});
  fill($("page-setup"),[
    h("div",{class:"phead"},[h("div",null,[h("div",{class:"eyebrow",text:"Configuration"}),h("h1",{text:"Setup"})])]),
    h("div",{class:"card stackg"},[h("h2",{text:"Hunter",style:"margin:0"}),
      h("label",{class:"field"},["Name",name]),
      h("label",{class:"field"},["Weekend reward text",reward]),
      h("button",{class:"btn gold",type:"button",text:"Preview reward popup",onclick:function(){
        notify({kind:"reward",tag:"Weekend gate cleared",title:state.reward,body:"Preview only. No XP awarded."})}}),
      h("button",{class:"btn ghost",type:"button",text:"Preview level-up",onclick:function(){
        var l=levelOf(totalXp()).level;notify({kind:"level",tag:"System notice",from:l,to:l+1,title:"Level up",body:"Preview only. Your level has not changed."})}})]),
    h("div",{class:"card"},[h("h2",{text:"Sleep grading"}),
      h("div",{class:"row"},[h("label",{class:"field"},["Top wake-up XP by",best]),h("label",{class:"field"},["Hours asleep goal",goal])]),
      h("p",{class:"note",style:"margin-top:10px",text:"Wake-up XP drops by 10 for each hour after that time."})]),
    h("div",{class:"card"},[h("h2",{text:"Daily quests and XP"})].concat(qrows,[
      h("div",{class:"qedit",style:"margin-top:14px"},[nq,nx,h("button",{class:"btn",type:"button",text:"Add",onclick:addQuest})]),
      h("p",{class:"note",style:"margin-top:10px",text:"Base XP is earned at the minimum minutes, plus the extra XP for each further block. Set minimum minutes to 0 for a quest that is not timed. Habits you add are worth a fixed "+CUSTOM_XP+" XP that cannot be changed. Changes apply to future completions."})])),
    h("div",{class:"card stackg"},[h("h2",{text:"This weekend's challenge",style:"margin:0"}),
      c.done?h("p",{class:"note",text:"Already cleared. You can set the next one from Saturday."}):h("label",{class:"field"},["Challenge",ct]),
      c.done?null:h("div",{class:"row"},[h("label",{class:"field"},["Target",cn]),h("label",{class:"field"},["Unit",cu]),
        h("button",{class:"btn",type:"button",text:"Set",onclick:function(){
          var t=ct.value.trim(),n=Number(cn.value),u=cu.value.trim();if(!t||!(n>0)||!u)return;
          lastGatePct=0;quiet(function(){setChallenge({title:t,target:n,unit:u,xp:c.xp,progress:0,done:false})});toast("Weekend challenge updated");renderSetup()}})])]),
    h("div",{class:"card stackg"},[h("h2",{text:"AI challenges",style:"margin:0"}),
      h("label",{class:"field"},["Perplexity API key",keyIn]),
      h("p",{class:"note",text:pplxKey?"Key saved on this device only. The Gate page now has an AI challenge button.":"Optional. Paste a key to get AI-written weekend challenges. It is stored on this device only."})]),
    h("div",{class:"card stackg"},[h("h2",{text:"Data",style:"margin:0"}),
      h("p",{class:"note",text:sync==="account"?"Progress is saved to your account and follows you across devices.":"Progress is saved on this device only. Copy a backup now and then so you can restore it."}),
      h("button",{class:"btn ghost",type:"button",text:"Copy backup",onclick:function(){
        var txt=JSON.stringify(state);backup.value=txt;
        try{navigator.clipboard.writeText(txt).then(function(){toast("Backup copied")},function(){backup.select();toast("Select and copy the text below")})}
        catch(e){backup.select();toast("Select and copy the text below")}}}),
      h("label",{class:"field"},["Backup text",backup]),
      h("button",{class:"btn ghost",type:"button",text:"Restore from backup text",onclick:function(){

      h("button",{class:"btn bad",type:"button",text:resetArmed?"Press again to erase everything":"Erase all progress",onclick:function(){
        if(!resetArmed){resetArmed=true;renderSetup();return}
        var keep={name:state.name,reward:state.reward,sleep:state.sleep,quests:state.quests};pending={};
        state=defaults();state.name=keep.name;state.reward=keep.reward;state.sleep=keep.sleep;state.quests=keep.quests;syncTypes();
        save();resetArmed=false;lastGatePct=0;shownXp=null;updateTop(false);renderSetup();toast("Progress erased")}})])
  ]);

/* ---- routing ---- */
var current="quests";
var RENDER={quests:renderQuests,sleep:renderSleep,gate:renderGate,hero:renderHero,stats:renderStats,setup:renderSetup};
function render(animate){updateTop(animate);RENDER[current]()}
function show(name,animate){
  if(stage&&name!=="hero")stage.setActive(false);
  if(PAGES.indexOf(name)<0)name="quests";
  var from=PAGES.indexOf(current),to=PAGES.indexOf(name);
  if(name==="setup")resetArmed=false;
  if(name==="gate"&&name!==current)lastGatePct=0;
  current=name;
  PAGES.forEach(function(p){
    var el=$("page-"+p);el.hidden=p!==name;el.classList.remove("in-r","in-l");
  });
  document.querySelectorAll(".tab").forEach(function(t){
    if(t.dataset.page===name)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current");
  });
  $("ink").style.transform="translateX("+(to*100)+"%)";
  render(false);
  var pg=$("page-"+name);
  if(animate&&to!==from){void pg.offsetWidth;pg.classList.add(to>from?"in-r":"in-l")}
  $("main").scrollTop=0;
}
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click",function(){
    var p=t.dataset.page;if(p===current)return;
    show(p,true);
    try{if(location.hash!=="#"+p)history.replaceState(null,"","#"+p)}catch(e){try{location.hash=p}catch(e2){}}
  });
});
window.addEventListener("hashchange",function(){var p=location.hash.slice(1);if(p&&p!==current&&PAGES.indexOf(p)>=0)show(p,true)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("veil").classList.contains("open"))nextNotice()});
$("main").addEventListener("animationend",function(e){if(e.target.classList&&e.target.classList.contains("page"))e.target.classList.remove("in-r","in-l")});

/* ---- boot ---- */
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
show(location.hash.slice(1)||"quests",false);
var lastDay=today();
document.addEventListener("visibilitychange",function(){
  if(stage)stage.setActive(!document.hidden&&current==="hero");
  if(!document.hidden&&today()!==lastDay){lastDay=today();render(false)}});
window.addEventListener("load",function(){if(current==="hero"&&!stage)renderHero()});

(function connect(){
  var c=window.claude;if(!c||typeof c.use!=="function")return;
  c.use("sample").then(function(s){if(s){sample=s;if(current==="gate")renderGate()}},function(){});
  Promise.all([c.use("db"),c.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return null;
    return Promise.resolve(user.id()).then(function(id){
      if(!id)return null;
      var ref=db.doc("data/users/"+id+"/hunter");
      var timeout=new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"))},10000)});
      return Promise.race([ref.get(),timeout]).then(function(snap){
        docRef=ref;
        var remote=snap.exists?snap.data():null;
        if(remote&&!(state.updatedAt>(Number(remote.updatedAt)||0))){
          state=normalize(JSON.parse(JSON.stringify(remote)));
          try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}
          shownXp=null;render(false);
        }else if(state.updatedAt){dirty=true;flush()}
        setSync("account");
      });
    });
  }).catch(function(){setSync("device")});
})();
})();
